<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <title>{{titulo}}</title>
    <link rel="stylesheet"  href="{{url_for('static', filename='bootstrap.css')}}">
</head>
<body>
<!-- criando um padão de layout para organizar os elementos dinâmicos e estáticos, cria se um arquivo html e usa o extends nos arquivos filhos-->
          
<!-- Navbar é basicamente um menu de navegação que leva para as outras páginas, no "href" coloca a rota da página -->
<nav class="navbar navbar-expand-lg bg-body-tertiary">
        <div class="container-fluid">
            <a class="navbar-brand" href="/">Lista de Músicas</a>
            <button class="navbar-toggler" type="button" data-bs-toggle="collapse" data-bs-target="#navbarNav" aria-controls="navbarNav" aria-expanded="false" aria-label="Toggle navigation">
            <span class="navbar-toggler-icon"></span>
            </button>
            <div class="collapse navbar-collapse" id="navbarNav">
            <ul class="navbar-nav">
                <li class="nav-item">
                <a class="nav-link active" aria-current="page" href="/">início</a>
                </li>
                <li class="nav-item">
                <a class="nav-link" href="/cadastrar_musicas">cadastrar música</a>
                </li>
                <li class="nav-item">
                <a class="nav-link" href="/sair">Sair</a>
                </li>
            </ul>
            </div>
        </div>
        </nav>

        
        <div class="container">
        <h1>{{titulo}}</h1>
<!-- Se faz necessário usar os comandos abaixo para definir o conteúdo da página -->
        {% block conteudo %}{% endblock %}
        </div>
</body>
</html>
